[package]
name = "cloison-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/coucagog/cloison-core"
description = "CLOISON core engine: deterministic PII detection, HMAC tokenization, encrypted vault, weak-cardinality generalization. Compiles native and WASM."

[dependencies]
regex = "1"
aho-corasick = "1"
hmac = "0.12"
sha2 = "0.10"
blake3 = "1"
redb = "2"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base32 = "0.5"
base64 = "0.22"
thiserror = "1"
tracing = "0.1"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
unicode-normalization = "0.1"
rand = "0.8"

[features]
default = ["native"]
native = []
wasm = []

[dev-dependencies]
proptest = "1"
insta = "1"
tempfile = "3"

[target."cfg(target_arch = \"wasm32\")".dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
